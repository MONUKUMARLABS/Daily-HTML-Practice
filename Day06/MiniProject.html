<!DOCTYPE html>
<html>
    <head>
        <title>HTML Form</title>
    </head>
    <body>
        <h1>Student Registration</h1>
        <form>
            <label>Full Name</label><br>
            <input type="text"><br><br>

            <label>Email</label><br>
            <input type="email"><br><br>

            <label>Password</label><br>
            <input type="password"><br><br>

            <label>Age</label><br>
            <input type="number"><br><br>

            <label>Gender</label><br>
            <input type="radio" name="gender" value="male"> Male
            <input type="radio" name="gender" value="female"> Female
            <input type="radio" name="gender" value="other"> Other
            <br><br>

            <label>City</label><br>
            <input type="text"><br><br>

            <label>Country</label><br>
            <select>
                <option value="india">India</option>
                <option value="usa">USA</option>
                <option value="uk">UK</option>
                <option value="canada">Canada</option>
            </select>
            <br><br>

            <input type="submit" value="Register Button">
            
        </form>
        <hr>
        <img src="https://www.google.com/images/branding/googlelogo/1x/googlelogo_color_272x92dp.png" alt="Google Logo" width="200">

        <a href="https://www.google.com">Visit Google</a>
        <br><br>
        <img src="https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png" alt="GitHub Logo" width="200">
        <a href="https://www.github.com">Visit GitHub</a>
    </body>
</html>
