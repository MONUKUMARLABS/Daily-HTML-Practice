<!DOCTYPE html>
<html>
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Responsive Cards</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>


    <nav class="navbar">

    <div class="logo">
        <strong>My Portfolio</strong>
    </div>

    <div class="links">

        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Skills</a>
        <a href="#">Projects</a>
        <a href="#">Contact</a>

    </div>

</nav>

    <section class="cards">

        <div class="card">
            <h2>HTML</h2>
            <p>Learn HTML fundamentals.</p>
        </div>

        <div class="card">
            <h2>CSS</h2>
            <p>Learn modern CSS layouts.</p>
        </div>

        <div class="card">
            <h2>JavaScript</h2>
            <p>Learn programming for the web.</p>
        </div>

        <div class="card">
            <h2>C#</h2>
            <p>Learn C# programming.</p>
        </div>

        <div class="card">
            <h2>SQL</h2>
            <p>Learn relational databases.</p>
        </div>

        <div class="card">
            <h2>ASP.NET Core</h2>
            <p>Build modern backend applications.</p>
        </div>

    </section>

    <div class="image-container">

    <img src="image.jpg" alt="Developer">

    <ul class="nav nav-pills nav-fill gap-2 p-1 small bg-primary rounded-5 shadow-sm" id="pillNav2" role="tablist" style="--bs-nav-link-color: var(--bs-white); --bs-nav-pills-link-active-color: var(--bs-primary); --bs-nav-pills-link-active-bg: var(--bs-white);">
  <li class="nav-item" role="presentation">
    <button class="nav-link active rounded-5" id="home-tab2" data-bs-toggle="tab" type="button" role="tab" aria-selected="true">Home</button>
  </li>
  <li class="nav-item" role="presentation">
    <button class="nav-link rounded-5" id="profile-tab2" data-bs-toggle="tab" type="button" role="tab" aria-selected="false">Profile</button>
  </li>
  <li class="nav-item" role="presentation">
    <button class="nav-link rounded-5" id="contact-tab2" data-bs-toggle="tab" type="button" role="tab" aria-selected="false">Contact</button>
  </li>
</ul>

</div>
</body>
</html>
